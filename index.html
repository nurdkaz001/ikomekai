<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astana Smart City - AI Incident Manager</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <link href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css)" rel="stylesheet">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- Шапка -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-city text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-teal-300 bg-clip-text text-transparent">Astana SmartCity AI</h1>
                    <p class="text-xs text-slate-400">Интеллектуальный контроль городской среды</p>
                </div>
            </div>
            <div class="bg-slate-800 border border-slate-700 px-3.5 py-1.5 rounded-full text-xs text-slate-300 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                DeepSeek AI Active
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">

        <!-- Левая колонка: Форма подачи заявки -->
        <div class="lg:col-span-5">
            <div class="bg-slate-800/80 border border-slate-700 p-6 rounded-2xl shadow-xl sticky top-24 backdrop-blur-sm">
                <h2 class="text-lg font-semibold mb-4 text-white flex items-center gap-2">
                    <i class="fa-solid fa-bullhorn text-blue-400"></i> Сообщить об инциденте
                </h2>
                
                <form id="reportForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Описание проблемы</label>
                        <textarea id="description" required rows="4" 
                            class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 transition placeholder-slate-500"
                            placeholder="Например: Возле Экспо на парковке открыт канализационный люк, создается опасность для авто и пешеходов..."></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Прикрепить фото</label>
                        <input type="file" id="fileInput" accept="image/*"
                            class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-blue-600/20 file:text-blue-400 file:font-medium hover:file:bg-blue-600/30 transition cursor-pointer">
                    </div>

                    <button type="submit" id="submitBtn" 
                        class="w-full bg-gradient-to-r from-blue-600 to-teal-500 hover:from-blue-500 hover:to-teal-400 text-white font-medium py-3 rounded-xl transition-all shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> Отправить в Акимат
                    </button>
                </form>
            </div>
        </div>

        <!-- Правая колонка: Лента инцидентов / Дашборд -->
        <div class="lg:col-span-7">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-teal-400"></i> Мониторинг обращений
                </h2>
                <button onclick="loadReports()" class="text-xs text-slate-400 hover:text-white transition flex items-center gap-1">
                    <i class="fa-solid fa-rotate text-xs"></i> Обновить
                </button>
            </div>

            <div id="reportsList" class="space-y-4">
                <!-- Карточки загружаются через JS -->
            </div>
        </div>

    </main>

    <script>
        // ЗАМЕНИ НА СВОЙ URL ИЗ RENDER:
        const API_URL = "https://ikomek-ai.onrender.com";

        const getUrgencyBadge = (urgency) => {
            if (urgency === 'Высокий') return 'bg-rose-500/20 text-rose-400 border-rose-500/30';
            if (urgency === 'Средний') return 'bg-amber-500/20 text-amber-400 border-amber-500/30';
            return 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
        };

        async function loadReports() {
            const container = document.getElementById('reportsList');
            try {
                const res = await fetch(`${API_URL}/api/reports`);
                const reports = await res.json();
                
                if (!reports || reports.length === 0) {
                    container.innerHTML = `
                        <div class="bg-slate-800/40 border border-slate-700/50 p-8 rounded-2xl text-center text-slate-400">
                            <i class="fa-regular fa-folder-open text-3xl mb-2 text-slate-500"></i>
                            <p>Пока нет зарегистрированных инцидентов</p>
                        </div>`;
                    return;
                }

                container.innerHTML = reports.map(r => `
                    <div class="bg-slate-800/80 border border-slate-700/80 p-5 rounded-2xl shadow-lg hover:border-slate-600 transition animate-fade-in flex flex-col gap-3">
                        <div class="flex justify-between items-center">
                            <span class="bg-blue-500/20 text-blue-300 border border-blue-500/30 text-xs px-2.5 py-1 rounded-lg font-semibold">
                                ${r.category || 'Общее'}
                            </span>
                            <span class="border text-xs px-2.5 py-1 rounded-lg font-semibold ${getUrgencyBadge(r.urgency)}">
                                Приоритет: ${r.urgency || 'Средний'}
                            </span>
                        </div>

                        <p class="text-sm text-slate-200">${r.description}</p>

                        ${r.image_url ? `
                            <img src="${r.image_url}" class="rounded-xl h-48 w-full object-cover border border-slate-700">
                        ` : ''}

                        <div class="bg-slate-900/80 border border-slate-700/60 p-3 rounded-xl text-xs text-slate-300">
                            <div class="text-teal-400 font-semibold mb-1 flex items-center gap-1">
                                <i class="fa-solid fa-robot"></i> AI Анализ (DeepSeek):
                            </div>
                            ${r.ai_summary}
                        </div>

                        <div class="flex justify-between items-center text-[10px] text-slate-500 pt-2 border-t border-slate-700/50">
                            <span>Статус: <strong class="text-slate-300">${r.status || 'Новая'}</strong></span>
                            <span>${new Date(r.created_at).toLocaleString('ru-RU')}</span>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `
                    <div class="bg-rose-500/10 border border-rose-500/30 p-4 rounded-xl text-xs text-rose-400">
                        Ошибка загрузки данных. Проверь connection к API.
                    </div>`;
            }
        }

        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const formData = new FormData();
            
            formData.append('description', document.getElementById('description').value);
            const fileInput = document.getElementById('fileInput').files[0];
            if (fileInput) formData.append('file', fileInput);

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Анализ ИИ...`;

            try {
                await fetch(`${API_URL}/api/report`, { method: 'POST', body: formData });
                document.getElementById('reportForm').reset();
                loadReports();
            } catch (err) {
                alert("Ошибка при отправке формы!");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Отправить в Акимат`;
            }
        });

        loadReports();
    </script>
</body>
</html>
