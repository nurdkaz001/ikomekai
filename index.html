<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astana Smart City - AI Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div class="max-w-4xl mx-auto p-6">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold text-blue-600">Astana Smart City 🏙️</h1>
            <p class="text-slate-500">Система интеллектуальной обработки обращений граждан с DeepSeek AI</p>
        </header>

        <!-- Форма отправки -->
        <div class="bg-white p-6 rounded-2xl shadow-lg mb-8 border border-slate-100">
            <h2 class="text-xl font-semibold mb-4">Сообщить о проблеме в городе</h2>
            <form id="reportForm" class="space-y-4">
                <div>
                    лә <label class="block text-sm font-medium text-slate-700 mb-1">Описание проблемы</label>
                    <textarea id="description" required rows="3" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Например: Возле ЕХРО на дороге глубокая яма, опасная для машин..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Фотография</label>
                    <input type="file" id="fileInput" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition shadow-md">Отправить заявку в акимат</button>
            </form>
        </div>

        <!-- Лента заявок / Дашборд -->
        <h2 class="text-2xl font-bold mb-4">Поступившие заявки</h2>
        <div id="reportsList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Карточки подгружаются через JS -->
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000"; // Заменишь на ссылку Render после деплоя

        async function loadReports() {
            const res = await fetch(`${API_URL}/api/reports`);
            const reports = await res.json();
            const container = document.getElementById('reportsList');
            container.innerHTML = '';
            
            reports.forEach(r => {
                container.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl shadow-md border border-slate-100 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <span class="bg-blue-100 text-blue-700 text-xs px-2.5 py-1 rounded-full font-semibold">${r.category}</span>
                                <span class="bg-amber-100 text-amber-700 text-xs px-2.5 py-1 rounded-full font-semibold">Приоритет: ${r.urgency}</span>
                            </div>
                            <p class="text-slate-700 mb-3">${r.description}</p>
                            ${r.image_url ? `<img src="${r.image_url}" class="rounded-xl h-40 w-full object-cover mb-3">` : ''}
                            <div class="bg-slate-50 p-3 rounded-xl text-sm text-slate-600 mb-3 border">
                                <strong>AI Анализ:</strong> ${r.ai_summary}
                            </div>
                        </div>
                        <div class="text-xs text-slate-400">Статус: ${r.status}</div>
                    </div>
                `;
            });
        }

        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('description', document.getElementById('description').value);
            const fileInput = document.getElementById('fileInput').files[0];
            if (fileInput) formData.append('file', fileInput);

            const btn = e.target.querySelector('button');
            btn.textContent = 'ИИ анализирует и отправляет...';
            btn.disabled = true;

            await fetch(`${API_URL}/api/report`, { method: 'POST', body: formData });
            
            document.getElementById('reportForm').reset();
            btn.textContent = 'Отправить заявку в акимат';
            btn.disabled = false;
            loadReports();
        });

        loadReports();
    </script>
</body>
</html>
